name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_deployUsername: ${{ secrets.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_deployPassword: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish snapshot
        if: github.ref_type == 'branch'
        run: ./gradlew :namebook-api:publish
      - name: Publish release
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          ./gradlew :namebook-api:publish -PreleaseVersion="${tag#v}"
