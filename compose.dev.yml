# Development MariaDB for the local `./gradlew runServer` test server.
#
# Managed by the startDevDb / stopDevDb / resetDevDb Gradle tasks in
# namebook-paper/build.gradle.kts; runServer depends on startDevDb, so a plain
# `./gradlew runServer` brings this up first and points the plugin at it.
#
# This is a DEVELOPMENT database. The credentials are deliberately trivial and
# port 3307 is published on this machine — do not reuse this file for anything
# reachable from outside your machine.
name: namebook-dev

services:
  mariadb:
    # Pinned to the same image the Testcontainers-backed tests use
    # (namebook-core AbstractDatabaseTest) so dev and test run one engine.
    image: mariadb:11.7
    container_name: namebook-dev-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: namebook
      MARIADB_USER: namebook
      MARIADB_PASSWORD: namebook
      MARIADB_ROOT_PASSWORD: root
    ports:
      # Host port 3307, not 3306, so this can run beside another project's dev
      # database. Matches devDbUrl in namebook-paper/build.gradle.kts and the url in
      # the generated run/plugins/Namebook/database.yml.
      - "3307:3306"
    volumes:
      # Named volume, so data survives a restart.
      # `./gradlew resetDevDb` drops it for a clean schema.
      - namebook-dev-db:/var/lib/mysql
    healthcheck:
      # Ships with the mariadb image. `--connect` alone returns healthy before
      # InnoDB has finished recovery, which lets the server race a DB that
      # cannot yet serve queries.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  namebook-dev-db:
