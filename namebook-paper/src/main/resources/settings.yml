# Namebook settings.
#
# Durations are written as a number plus a unit: s (seconds), m (minutes), h (hours),
# d (days), w (weeks). Units can be combined, for example 1h30m.
# A value that cannot be read is reported in the server log and replaced by its default.
#
# Missing keys are added back, with their default value, each time the plugin loads. A pristine
# copy of this file is kept in defaults/default-settings.yml for comparison.

# Bedrock players join through Floodgate with a prefix in front of their name. When Floodgate
# is installed, its own username-prefix and replace-spaces are used instead of these two.
bedrock:
  # The prefix Floodgate puts in front of Bedrock names. Leave it empty ('') if Floodgate
  # is configured without a prefix. A prefix with letters, digits or _ makes Bedrock names
  # look like Java names; Namebook warns about it at startup.
  prefix: '.'
  # Whether Floodgate replaces spaces in gamertags with _ (Floodgate's replace-spaces).
  replace-spaces: true

# The in-memory cache in front of the database and the remote sources. Each server has its own.
cache:
  # How long a found name stays cached.
  ttl: 10m
  # How long an unknown name stays cached, so repeated misses do not hit the network.
  miss-ttl: 1m
  # The most entries kept. The oldest are dropped first.
  max-entries: 10000

# playerdb.co is asked first when a name is not in the database.
playerdb:
  enabled: true
  # How long to wait for an answer before treating the name as unknown.
  timeout: 3s
  # The most requests sent per minute. Further lookups skip this source until the minute is up.
  max-per-minute: 30

# Mojang is asked only when playerdb.co gives no answer, and never for Bedrock players.
mojang:
  enabled: true
  timeout: 3s
  max-per-minute: 30
